name: ${COMPOSE_PROJECT_NAME}
services:
  webserver:
    build: ./webserver
    container_name: webserver
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ../app/public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - bugtracker

  app:
    build: ./app
    container_name: application
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_PASS: ${DB_PASS}
      APP_ADMIN_MAIL: ${APP_ADMIN_MAIL}
      APP_ADMIN_USER: ${APP_ADMIN_USER}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS}
      APP_LOCALE: ${APP_LOCALE}
    volumes:
      - ../app:/var/www/html
    depends_on:
      - db
    networks:
      - bugtracker

  db:
    image: postgres:16-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - bugtracker

networks:
  bugtracker:

volumes:
  db-data:
